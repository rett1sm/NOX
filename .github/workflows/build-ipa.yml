name: Build NOX IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nox-ios-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned IPA
        run: |
          xcodebuild \
            -project NOX.xcodeproj \
            -scheme NOX \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p package/Payload
          cp -R build/Build/Products/Release-iphoneos/NOX.app package/Payload/
          cd package
          zip -qry ../NOX-0.1.0-dev-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: NOX-0.1.0-dev-unsigned-IPA
          path: NOX-0.1.0-dev-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
